name: Run tests

on:
    workflow_dispatch:
        inputs:
            test-filter:
                description: 'Optional node --test name pattern; empty runs the full suite'
                required: false
                default: ''

permissions:
    contents: read

jobs:
    test:
        timeout-minutes: 40
        strategy:
            matrix:
                node: [20.x, 22.x, 24.x, 26.x]
                os: [ubuntu-latest]
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@v5
            - name: Use Node.js ${{ matrix.node }}
              uses: actions/setup-node@v5
              with:
                  node-version: ${{ matrix.node }}
            - run: npm install
            - run: |
                  if [ -n "${{ inputs.test-filter }}" ]; then
                    npm run build
                    node --import tsx --test --test-concurrency=1 --test-name-pattern="${{ inputs.test-filter }}" $(find test \( -name '*-test.ts' -o -name '*.test.ts' \))
                  else
                    npm test
                  fi
            - run: npm pack
              if: matrix.node == '24.x'
            - uses: actions/upload-artifact@v4
              if: matrix.node == '24.x'
              with:
                  name: nodemailer-tgz
                  path: nodemailer-*.tgz
                  if-no-files-found: error

    # The library is used from Bun as well: the ESM build and the same test
    # suite are run under the latest Bun release
    bun:
        timeout-minutes: 40
        if: ${{ inputs.test-filter == '' }}
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
            - name: Use Node.js 24.x
              uses: actions/setup-node@v5
              with:
                  node-version: 24.x
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest
            - run: npm install
            - run: npm run test:bun

    # Coverage is gated separately on a single Node.js version: c8's dependency
    # chain (yargs) is not yet loadable on Node.js 26, and coverage numbers are
    # the same across versions, so there is no need to run it across the matrix.
    coverage:
        timeout-minutes: 40
        if: ${{ inputs.test-filter == '' }}
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
            - name: Use Node.js 24.x
              uses: actions/setup-node@v5
              with:
                  node-version: 24.x
            - run: npm install
            - run: npm run test:coverage
